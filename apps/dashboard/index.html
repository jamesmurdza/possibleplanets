<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Climate Models Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
  <!-- Minimal version (PLATFORM.md): one screen, three controls, one chart.
       No build tooling -- plain HTML/JS/CSS, Chart.js pulled from a CDN,
       so this app has zero install step beyond serving static files. -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
  <header class="toolbar">
    <div class="toolbar-brand">
      <span class="toolbar-dot" aria-hidden="true"></span>
      <h1 class="toolbar-title">Climate Models</h1>
    </div>

    <div class="toolbar-controls">
      <!-- Custom dropdown UI, kept in sync with a real (visually hidden)
           <select> underneath -- app.js still just populates/reads the
           <select> as plain option elements and .value, same as before this
           was restyled, so none of its model/schema-loading logic changed. -->
      <div class="dropdown" data-dropdown-for="model-select">
        <button type="button" class="dropdown-toggle" aria-haspopup="listbox" aria-expanded="false">
          <span class="dropdown-value">Loading...</span>
          <svg class="dropdown-chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <ul class="dropdown-menu" role="listbox" hidden></ul>
        <select id="model-select" class="visually-hidden-select" aria-label="Model"></select>
      </div>

      <div class="dropdown" data-dropdown-for="scenario-select">
        <button type="button" class="dropdown-toggle" aria-haspopup="listbox" aria-expanded="false">
          <span class="dropdown-value">Loading...</span>
          <svg class="dropdown-chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <ul class="dropdown-menu" role="listbox" hidden></ul>
        <select id="scenario-select" class="visually-hidden-select" aria-label="Scenario"></select>
      </div>

      <span class="toolbar-divider" aria-hidden="true"></span>

      <button id="run-button" class="icon-button" title="Run" aria-label="Run">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l10-5.5-10-5.5z" fill="currentColor"/></svg>
      </button>
      <!-- Only shown when the displayed result came from the cache (see
           apps/gateway/cache.py) -- forces a real re-run, appended to the
           cache log as a newer entry rather than replacing the old one. -->
      <button id="refresh-button" class="icon-button secondary" title="Re-run without using the cached result" aria-label="Refresh" hidden>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 10-1.64 3.93M13.5 8V4.5M13.5 8H10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <a id="raw-download-link" class="icon-button secondary" href="#" download="result.json" title="Download raw output (JSON)" aria-label="Download raw output (JSON)" hidden>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v7.5M4.5 7l3.5 3.5L11.5 7M3 13.5h10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </div>
  </header>

  <main class="content">
    <section class="panel">
      <div class="panel-body">
        <canvas id="result-chart" height="220"></canvas>
        <div id="chart-placeholder" class="chart-placeholder">No result yet</div>

        <!-- Shown over the chart (not above it) while a run is queued/running,
             so an existing chart stays visible, dimmed, underneath it instead
             of being pushed down by a separate loading strip. -->
        <div id="loading-overlay" class="loading-overlay" hidden>
          <div class="loading-box">
            <span id="loading-text" class="loading-text"></span>
            <progress id="progress-bar" class="progress-bar" max="100" value="0"></progress>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="statusbar">
    <span id="status-text" class="status-text">Select a model and scenario, then click Run.</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
