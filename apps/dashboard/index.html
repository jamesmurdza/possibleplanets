<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Climate Models Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
  <!-- Minimal version (PLATFORM.md): one screen, three controls, one chart.
       No build tooling -- plain HTML/JS/CSS, Chart.js pulled from a CDN,
       so this app has zero install step beyond serving static files. -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
  <header class="toolbar">
    <div class="toolbar-brand">
      <span class="toolbar-dot" aria-hidden="true"></span>
      <h1 class="toolbar-title">Climate Models</h1>
    </div>

    <div class="toolbar-controls">
      <select id="model-select" aria-label="Model"></select>
      <select id="scenario-select" aria-label="Scenario"></select>
      <button id="run-button">Run</button>
      <!-- Only shown when the displayed result came from the cache (see
           apps/gateway/cache.py) -- forces a real re-run, appended to the
           cache log as a newer entry rather than replacing the old one. -->
      <button id="refresh-button" class="secondary" title="Re-run without using the cached result" hidden>
        Refresh
      </button>
    </div>
  </header>

  <main class="content">
    <section class="panel">
      <div class="panel-header">
        <span id="status-text" class="status-text">Select a model and scenario, then click Run.</span>
      </div>

      <div class="panel-body">
        <canvas id="result-chart" height="320"></canvas>
        <div id="chart-placeholder" class="chart-placeholder">No result yet</div>

        <!-- Shown over the chart (not above it) while a run is queued/running,
             so an existing chart stays visible, dimmed, underneath it instead
             of being pushed down by a separate loading strip. -->
        <div id="loading-overlay" class="loading-overlay" hidden>
          <div class="loading-box">
            <span id="loading-text" class="loading-text"></span>
            <progress id="progress-bar" class="progress-bar" max="100" value="0"></progress>
          </div>
        </div>
      </div>

      <div class="panel-footer">
        <a id="raw-download-link" class="raw-link" href="#" download="result.json" hidden>
          Download raw output (JSON)
        </a>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
